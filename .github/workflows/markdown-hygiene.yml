name: Markdown hygiene

on:
  push:
  pull_request:

jobs:
  check-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for empty Markdown files
        run: |
          find . -name "*.md" -type f -print0 | while IFS= read -r -d '' file; do
            test -s "$file"
          done
      - name: Check important links
        run: |
          grep -R "https://github.com/The-Geek-Freaks/NEOTH" README.md docs protocols

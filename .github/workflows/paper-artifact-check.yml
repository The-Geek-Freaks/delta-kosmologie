name: Paper artifact check

on:
  push:
  pull_request:

jobs:
  check-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check paper artifacts
        run: |
          test -s paper/delta-cosmology-v1.0.md
          test -s paper/delta-cosmology-v1.0.html
          test -s paper/delta-kosmologie-v1.0.txt
          test -s protocols/pilot-b-neoth.md
          test -s schemas/neoth-babel-event.schema.json
          test -s schemas/neoth-babel-window.schema.json
          test -s examples/neoth-babel-event.example.json
          test -s assets/delta-cosmology-overview.svg
          test -s assets/rdelta-framework-map.svg
          test -s assets/babel-index-pipeline.svg
          test -s assets/claim-boundary.svg
          test -s assets/social-preview.svg
          test -s assets/social-preview.png
          test -s codemeta.json
          test -s llms.txt

  <text x="82" y="414" class="small">memory, return,</text>
  <text x="82" y="440" class="small">stabilized iteration</text>
  <text x="306" y="380" class="tiny">R</text>

  <rect x="430" y="222" width="374" height="182" rx="26" fill="url(#core)" stroke="#2dd4bf" stroke-width="1.6" filter="url(#soft)"/>
  <text x="466" y="278" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="850" fill="#f8fafc">RDelta</text>
  <text x="466" y="322" class="small">recursion and difference as</text>
  <text x="466" y="348" class="small">co-conditions of observable structure</text>
  <rect x="466" y="366" width="278" height="42" rx="12" fill="#042f2e" stroke="#14b8a6"/>
  <text x="486" y="393" class="mono">structure = f(R, Delta)</text>

  <rect x="894" y="142" width="304" height="116" rx="18" class="card" filter="url(#soft)"/>
  <text x="924" y="188" class="label">Babel Index</text>
  <text x="924" y="222" class="small">loss of productive difference</text>
  <text x="924" y="248" class="small">as a measurable domain signal</text>

  <rect x="894" y="306" width="304" height="126" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.4" filter="url(#soft)"/>
  <text x="924" y="354" class="label">NEOTH Probe</text>
  <text x="924" y="388" class="small">async telemetry over LLM/agent</text>
  <text x="924" y="414" class="small">orchestration, tools, retries</text>


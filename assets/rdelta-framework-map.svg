<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Delta Cosmology framework map</title>
  <desc id="desc">Layered map from recursion and difference into RDelta, Babel Index telemetry, NEOTH runtime probing, and nested falsification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.52" stop-color="#101827"/>
      <stop offset="1" stop-color="#092f3c"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3b35"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="probe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { font: 800 48px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 22px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 800 28px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .small { font: 400 17px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 700 13px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; letter-spacing: 0.5px; }
      .mono { font: 600 19px Consolas, "SFMono-Regular", Menlo, monospace; fill: #a7f3d0; }
      .card { fill: #101827; stroke: #334155; stroke-width: 1.5; }
      .accent { stroke: #67e8f9; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .muted-line { stroke: #475569; stroke-width: 1.2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1110" cy="100" r="230" fill="#0e7490" opacity="0.16"/>
  <circle cx="110" cy="650" r="210" fill="#7c3aed" opacity="0.10"/>
  <path d="M0 605 C250 555 350 710 615 645 C840 590 1020 640 1280 565 L1280 720 L0 720 Z" fill="#0f766e" opacity="0.12"/>

  <text x="56" y="76" class="title">Delta Cosmology</text>
  <text x="58" y="112" class="subtitle">RDelta preformalism -> Babel Index telemetry -> NEOTH runtime falsification</text>

  <a href="https://deepwiki.com/The-Geek-Freaks/delta-kosmologie">
    <rect x="868" y="44" width="354" height="44" rx="22" fill="#1e1b4b" stroke="#8b5cf6"/>
    <text x="890" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ddd6fe">DeepWiki</text>
    <text x="988" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#c4b5fd">deepwiki.com/The-Geek-Freaks/delta-kosmologie</text>
  </a>

  <rect x="56" y="160" width="304" height="126" rx="18" class="card" filter="url(#soft)"/>
  <text x="82" y="208" class="label">Difference</text>
  <text x="82" y="242" class="small">distinction, boundary,</text>
  <text x="82" y="268" class="small">productive separability</text>
  <text x="300" y="208" class="tiny">DELTA</text>

  <rect x="56" y="332" width="304" height="126" rx="18" class="card" filter="url(#soft)"/>

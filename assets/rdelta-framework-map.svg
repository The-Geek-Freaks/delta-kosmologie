  <text x="924" y="533" class="label">Nested tests</text>
  <text x="924" y="562" class="small">raw controls, nulls, time splits</text>

  <line x1="360" y1="222" x2="430" y2="282" class="accent"/>
  <line x1="360" y1="392" x2="430" y2="342" class="accent"/>
  <line x1="804" y1="278" x2="894" y2="204" class="accent"/>
  <line x1="804" y1="326" x2="894" y2="368" class="accent"/>
  <line x1="1046" y1="432" x2="1046" y2="486" class="accent"/>

  <line x1="848" y1="118" x2="848" y2="604" class="muted-line"/>
  <text x="826" y="624" class="tiny" transform="rotate(-90 826 624)">CLAIM BOUNDARY</text>

  <rect x="56" y="606" width="1168" height="64" rx="18" fill="#020617" opacity="0.70" stroke="#334155"/>
  <text x="84" y="633" class="tiny">BABEL SCORE FAMILY</text>
  <text x="84" y="658" class="mono">B_d(t) = norm_d((C_d * K_d * M_d * A_d * V_d) / (D_d * H_d + epsilon))</text>
  <text x="804" y="634" class="tiny">PUBLIC SURFACES</text>
  <text x="804" y="658" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#cbd5e1">github.com/The-Geek-Freaks/delta-kosmologie  |  github.com/The-Geek-Freaks/NEOTH</text>
</svg>

  <text x="100" y="252" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Distinction, boundary,</text>
  <text x="100" y="276" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">productive separability</text>

  <text x="100" y="460" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">stabilized iteration</text>
  <rect x="438" y="256" width="318" height="150" rx="18" fill="#042f2e" stroke="#14b8a6"/>
  <text x="484" y="315" fill="#f0fdfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">RDelta</text>
  <text x="484" y="354" fill="#ccfbf1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Recursion and difference as</text>
  <text x="484" y="380" fill="#ccfbf1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">co-conditions of observable structure</text>
  <rect x="856" y="122" width="270" height="132" rx="16" fill="url(#card)" stroke="#334155"/>
  <text x="886" y="168" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Babel Index</text>
  <text x="886" y="202" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Loss of productive</text>
  <text x="886" y="226" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">difference in a domain</text>
  <rect x="856" y="314" width="270" height="132" rx="16" fill="url(#card)" stroke="#334155"/>
  <text x="886" y="360" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">NEOTH Probe</text>
  <text x="886" y="394" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Async telemetry over</text>

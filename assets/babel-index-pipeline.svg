<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Babel Index telemetry pipeline</title>
  <desc id="desc">Pipeline from NEOTH runtime events through rolling windows, feature extraction, Babel score computation, nested tests, and operational warning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#38bdf8"/>
    </marker>
    <style>
      .title { font: 850 44px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .box-title { font: 800 23px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .body { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .tiny { font: 700 12px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; letter-spacing: 0.5px; }
      .mono { font: 600 17px Consolas, "SFMono-Regular", Menlo, monospace; fill: #a7f3d0; }
      .edge { stroke: #38bdf8; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1050" cy="110" r="210" fill="#14b8a6" opacity="0.12"/>
  <circle cx="240" cy="580" r="190" fill="#f59e0b" opacity="0.08"/>

  <text x="56" y="70" class="title">Babel Index pipeline</text>
  <text x="58" y="105" class="subtitle">A NEOTH telemetry path that can fail cleanly under null models instead of becoming narrative evidence.</text>

  <rect x="56" y="164" width="170" height="148" rx="18" fill="#101827" stroke="#334155"/>
  <text x="82" y="210" class="box-title">Events</text>
  <text x="82" y="244" class="body">tool calls</text>
  <text x="82" y="266" class="body">agent spawns</text>
  <text x="82" y="288" class="body">retries, errors</text>

  <rect x="278" y="164" width="178" height="148" rx="18" fill="#102033" stroke="#2563eb"/>
  <text x="304" y="210" class="box-title">Windows</text>
  <text x="304" y="244" class="body">time buckets</text>
  <text x="304" y="266" class="body">session slices</text>
  <text x="304" y="288" class="body">task boundaries</text>

  <rect x="508" y="132" width="264" height="212" rx="22" fill="#082f49" stroke="#38bdf8"/>
  <text x="536" y="178" class="box-title">Feature extraction</text>
  <rect x="536" y="206" width="48" height="34" rx="10" fill="#0f172a" stroke="#67e8f9"/><text x="554" y="229" class="mono">C</text>
  <rect x="596" y="206" width="48" height="34" rx="10" fill="#0f172a" stroke="#67e8f9"/><text x="614" y="229" class="mono">K</text>
  <rect x="656" y="206" width="48" height="34" rx="10" fill="#0f172a" stroke="#67e8f9"/><text x="674" y="229" class="mono">M</text>
  <rect x="536" y="252" width="48" height="34" rx="10" fill="#0f172a" stroke="#67e8f9"/><text x="554" y="275" class="mono">A</text>
  <rect x="596" y="252" width="48" height="34" rx="10" fill="#0f172a" stroke="#67e8f9"/><text x="614" y="275" class="mono">V</text>
  <rect x="656" y="252" width="48" height="34" rx="10" fill="#0f172a" stroke="#67e8f9"/><text x="674" y="275" class="mono">D</text>
  <rect x="716" y="252" width="48" height="34" rx="10" fill="#0f172a" stroke="#67e8f9"/><text x="734" y="275" class="mono">H</text>
  <text x="536" y="320" class="body">raw variables stay testable on their own</text>

  <rect x="824" y="164" width="184" height="148" rx="18" fill="#0f3b35" stroke="#2dd4bf"/>
  <text x="852" y="210" class="box-title">Babel score</text>
  <text x="852" y="246" class="mono">B_mult</text>
  <text x="852" y="270" class="mono">B_log</text>
  <text x="852" y="294" class="mono">B_bottleneck</text>

  <rect x="1060" y="132" width="164" height="212" rx="20" fill="#1e1b4b" stroke="#8b5cf6"/>
  <text x="1086" y="178" class="box-title">Nested test</text>
  <text x="1086" y="214" class="body">raw controls</text>
  <text x="1086" y="236" class="body">null models</text>
  <text x="1086" y="258" class="body">time splits</text>
  <text x="1086" y="280" class="body">bootstrap</text>

  <path d="M226 238 H278" class="edge"/>
  <path d="M456 238 H508" class="edge"/>
  <path d="M772 238 H824" class="edge"/>
  <path d="M1008 238 H1060" class="edge"/>

  <rect x="156" y="430" width="970" height="94" rx="24" fill="#020617" opacity="0.72" stroke="#334155"/>
  <text x="188" y="468" class="tiny">VALID OUTCOME</text>
  <text x="188" y="496" class="body">The score matters only if it predicts agent loops, timeout cascades, context-limit failures, fallback collapse, or objective failure beyond raw telemetry.</text>
  <text x="188" y="522" class="body">If it does not beat the controls out of sample, the Babel-ratio structure is falsified for this domain.</text>
</svg>
